<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheets" href="./loginPage.css">
    

</head>
<style>
    .main-container {
        display: flex;
        border-style: solid;
        border-width: 2px;
       
    }

    .div-loginimage {
        height:450px;
        width: 450px;
        display: flex;
        flex-direction: row;


    }

    .email-button {
        margin-bottom: 20px;
        padding-top: 10px;
        padding-bottom: 10px;
        margin-right: 10px;
    }

    .second-container {
        display: flex;
        flex-direction: column;

    }

    .login-button {
        background-color: rgb(26, 26, 136);
        color: white;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 200px;
        padding-right: 200px;
        border: none;
    }

    .login-button:hover {
        opacity: 0.8;
        cursor: pointer;
    }

    p {
        text-align: center;
    }

    @media(min-width:400px) and (max-width:701px) {
            body {
               

                #main-container img {
                    display: none;
                }
            }
        }
   

       
    
</style>

<body>
    <form>

      
        <!-- <div id="smartphone">
            <h1>smartphone</h1>
        </div> --> 



        <div class="main-container">
            <div class="div-loginimage">
                <img src="./assests/loginImage.jpg" alt="login image">
            </div>
            <div class="second-container">
                <div class="logoimage">
                    <img src="./assests/logo.png" alt="logo">
                </div>

                <div>
                    <input style="padding :5px 141px " type="email" placeholder="Email Id*"><br><br>

                    <input style="padding :5px 141px" type="password" placeholder="Password*"><br><br>



                    <button class="login-button">login</button>

                    <div>
                        <p>Don't have an account? sign up here</p>
                    </div>
                </div>
            </div>
    </form>
</body>

</html>
